[package]
name = "sabtable"
version = "0.0.0"
edition = "2021"
publish = false

# Static lib linked into the C++ vgi_unit_tests binary. Exposes
# `vgi_rust_serve_table_sab_slot(slot)`: runs the real vgi *table-function*
# framework (`vgi::Worker` serving `count_to`) over a native ring slot (via the
# extern "C" vgi_sab_worker_* ops defined in the C++ test), so a C++ client
# driving WebWorkerFunctionConnection and the Rust worker meet over one ring in
# one process.
[lib]
name = "sabtable"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
# default-features=false drops `sqlite` (bundled libsqlite3) and `transport-http`
# (tokio); the worker falls back to the zero-dep FsStorage backend, so the native
# staticlib builds with no heavy/C deps.
vgi = { path = "../../../../vgi-rust/vgi", default-features = false }
# No direct `vgi-rpc` dependency: the trait signatures name vgi-rpc's
# `Result`/`RpcError`/`OutputCollector`, and `vgi` re-exports that crate
# (`vgi::vgi_rpc`, `vgi::{Result, RpcError}`) so a worker never names its
# version. A direct requirement here is how this fixture broke twice: whenever it
# lagged the SDK's vgi-rpc minor (0.x minors never unify), Cargo resolved a
# SECOND vgi-rpc beside vgi's and every trait impl failed with E0053
# (`expected vgi::RpcError, found vgi_rpc::RpcError`).
arrow-array = "59"
arrow-schema = "59"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 2

# No [patch.crates-io]: vgi-rust resolves vgi-rpc from crates.io (its workspace
# keeps any local-checkout patch uncommitted), so this crate resolves it the same
# way rather than against whatever branch a sibling vgi-rpc-rust checkout is on.
