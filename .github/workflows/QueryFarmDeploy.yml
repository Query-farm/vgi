#
# Builds VGI against released upstream DuckDB v2.0.0 and publishes the signed
# binaries to the Query.Farm extension repository (https://duckdb-extensions.query.farm,
# Cloudflare R2). See docs/upstream-duckdb-build.md and
# Query-farm/extension-ci-tools docs/query_farm_deploy.md.
#
# This is separate from MainDistributionPipeline.yml, which builds against the
# Haybarn engine for the Haybarn community lane. build.yml checks out DuckDB at
# duckdb_version in place of the duckdb submodule, so extension_config.cmake and
# vgi_engine_compat.hpp select the upstream engine and its httpfs.
#
# Like the other Query.Farm extensions, every push to v2.0 builds, tests and,
# if all of that passes, publishes. A manual dispatch republishes the branch head:
#   gh workflow run QueryFarmDeploy.yml --ref v2.0                    # publish
#   gh workflow run QueryFarmDeploy.yml --ref v2.0 -f dry_run=true    # sign, verify, list; upload nothing
#
name: Query.Farm Extension Deploy
on:
  push:
    branches:
      - v2.0
  workflow_dispatch:
    inputs:
      dry_run:
        description: Sign and verify, but upload nothing to the Query.Farm repository
        type: boolean
        default: false

# Key on the event too: a newer push supersedes an older push's run, but must
# never cancel a manual (workflow_dispatch) publish of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  duckdb-upstream-build:
    name: Build extension binaries (upstream DuckDB v2.0.0)
    uses: Query-farm/extension-ci-tools/.github/workflows/build.yml@query-farm
    with:
      duckdb_version: v2.0.0
      ci_tools_version: query-farm
      groups: |
        main:
          config: extension_config.cmake
          toolchain: rust
          extra_toolchains: parser_tools
      # Same exclusions as the Haybarn distribution lane (wasm_mvp, osx_amd64,
      # windows_arm64 and windows_amd64_mingw are not built on the 2.0 line),
      # plus the wasm builds, which VGI ships through its own wasm targets.
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;osx_amd64;windows_arm64;windows_amd64_mingw
    secrets:
      ccache_remote_token: ${{ secrets.QUERY_FARM_CCACHE_TOKEN }}

  duckdb-deploy:
    name: Deploy to duckdb-extensions.query.farm
    needs: duckdb-upstream-build
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/v2.0' || startsWith(github.ref, 'refs/tags/'))
    uses: Query-farm/extension-ci-tools/.github/workflows/_query_farm_deploy.yml@query-farm
    with:
      extension_name: vgi
      duckdb_version: v2.0.0
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      signing_key: ${{ secrets.QUERY_FARM_EXTENSION_SIGNING_KEY }}
      r2_access_key_id: ${{ secrets.QUERY_FARM_R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.QUERY_FARM_R2_SECRET_ACCESS_KEY }}
      cloudflare_purge_token: ${{ secrets.QUERY_FARM_CLOUDFLARE_PURGE_TOKEN }}
