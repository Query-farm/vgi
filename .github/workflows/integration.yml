# The VGI integration suite — the one job that actually runs a worker.
#
# This is separate from MainDistributionPipeline.yml on purpose. That pipeline
# calls a reusable workflow which exposes no hook to run a COMMAND before its
# test step (only `test_env_variables`), and on its Linux leg the tests run
# inside `docker run ... make test_release`, a fresh container. There is nowhere
# in it to install the fixture workers, so every integration .test file there
# hits `require-env VGI_TEST_WORKER` and skips. This workflow owns its own
# steps, so it can install first and then test.
#
# The fixture workers come from the PUBLIC vgi-python repo's dev-only sidecar —
# they are deliberately absent from the published wheel, which would otherwise
# pollute end-user PATH.
#
# Integration follows vgi-python's default branch so changes merged across the
# two repositories are continuously tested together. workflow_dispatch accepts
# an explicit revision only for targeted qualification runs.
name: Integration suite

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fixtures_ref:
        description: "vgi-python revision to take the fixture workers from"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration suite (launcher transport)
    # This job publishes the reusable native runner consumed by SDK jobs that
    # still run on Ubuntu 24.04. Building it on the moving ubuntu-latest image
    # (now Ubuntu 26) produced a GLIBC_2.43 dependency those consumers cannot
    # load. Keep the artifact baseline explicit and no newer than its users.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        # Explicit bash enables pipefail: tee must not hide a failed test.
        shell: bash
    env:
      VGI_INSTALL_FIXTURES: "1"
      VGI_FIXTURES_DIR: /tmp/vgi-python
      # Pin the coordinated Protocol 3.4 fixtures. Exact major+minor matching
      # deliberately rejects released 3.3 workers. TODO(release-wave): an
      # unreleased vgi-python protocol-3.4 commit (a full SHA: the install
      # fetches it by name; 3141d12 plus the rebuilt vgi-client.js). Its uv.lock
      # pins vgi-rpc-python protocol-3.4 a07ccf2 (upload URLs v2), so CI installs
      # vgi-rpc only through it. Move to the vgi-python 3.4 release tag.
      VGI_FIXTURES_REF: ${{ inputs.fixtures_ref || 'f2c066fb1d38603acb75361d019f8801012970ca' }}
      GEN: ninja
      BUILD_VGI_FILTER_V2_TESTS: "1"
      USE_MERGED_VCPKG_MANIFEST: "1"
      # Share the same R2-backed caches as the distribution pipeline. The
      # x-gha provider was removed from vcpkg, so its previous configuration
      # rebuilt every dependency despite exporting Actions cache credentials.
      VCPKG_BINARY_SOURCES: "clear;http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,readwrite,Authorization: Bearer ${{ secrets.HAYBARN_VCPKG_TOKEN }}"
      X_VCPKG_ASSET_SOURCES: "clear;x-azurl,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/assets/,auth=${{ secrets.HAYBARN_VCPKG_TOKEN }},readwrite"
      # Keep the existing GitHub ccache namespace below as a fast L1 and use
      # R2 as the cross-repository L2. Do not change the hash settings here:
      # doing so invalidates the already-warm integration cache.
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
      # Cargo's registry/source cache is small compared with compilation. Use
      # sccache for rustc output from both the CMake build and the qualification
      # bridge, backed by the worker's separate WebDAV keyspace.
      RUSTC_WRAPPER: sccache
      SCCACHE_WEBDAV_ENDPOINT: https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/sccache/
      SCCACHE_WEBDAV_TOKEN: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Tests gate engine-dependent files on VGI_ENGINE_* (require-env); make
      # exports them, but later steps run scripts/run_tests.py and the shell
      # scripts directly. Put the engine tree's values in every step's
      # environment. test/sql/engine_features/ fails if they are missing.
      - name: Export engine feature variables
        run: make -s --no-print-directory engine_test_env | tee -a "$GITHUB_ENV"

      - name: Check native artifact selection
        run: python3 -m unittest discover -s test/scripts -p 'test_*.py'

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

          # Match Haybarn's prebuilt CI images. Ubuntu's ccache 4.9.1 cannot
          # reliably write to an HTTP backend with bearer auth; 4.13.6 fixes
          # that. The static binaries avoid adding build-time dependencies.
          curl -fsSL \
            https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz \
            -o /tmp/ccache.tar.xz
          tar -xJf /tmp/ccache.tar.xz -C /tmp
          sudo install -m 0755 \
            /tmp/ccache-4.13.6-linux-x86_64-musl-static/ccache \
            /usr/local/bin/ccache

          curl -fsSL \
            https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/sccache.tar.gz
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache \
            /usr/local/bin/sccache
          rm -rf \
            /tmp/ccache.tar.xz \
            /tmp/ccache-4.13.6-linux-x86_64-musl-static \
            /tmp/sccache.tar.gz \
            /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl

          ccache --version
          sccache --version

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: vgi-integration-${{ runner.os }}

      - uses: dtolnay/rust-toolchain@1.97

      # Cache Cargo's downloaded registry and git sources separately from
      # rustc output (which sccache handles). The upstream revision is part of
      # the key because both Rust builds below use that pinned workspace.
      - name: Restore Cargo sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-sources-${{ runner.os }}-rust-1.97-vgi-rpc-9e7dfb59686682be0ff4a46183988e2724416393-${{ hashFiles('test/support/**/Cargo.lock') }}

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Build the extension (release)
        # The packaged SDK runner ships unittest alone, so it must not depend on
        # libhaybarn.so (rc10 engine option; the shell already links statically).
        env:
          EXT_FLAGS: -DHAYBARN_STATIC_UNITTEST=1
          # Also builds vgi_http_interrupt_tests (make test_http_interrupt).
          BUILD_VGI_HTTP_INTERRUPT_TESTS: "1"
        run: make release

      # SDKs changing the wire contract need the matching development client
      # before that revision is published to the signed community channel.
      # Both executables statically link VGI and its core dependencies.
      - name: Package native SDK CI executables
        if: github.ref == 'refs/heads/v2.0' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/ci_fetch_native_runner.py --pack \
            --source "$GITHUB_WORKSPACE" --build build/release \
            --output "$RUNNER_TEMP/vgi-native-runner"

      - name: Upload native SDK CI executables
        if: github.ref == 'refs/heads/v2.0' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vgi-native-runner-linux_amd64
          path: ${{ runner.temp }}/vgi-native-runner/
          if-no-files-found: error
          retention-days: 90

      - name: Run Filter v2 producer tests
        run: make test_filter_v2

      - name: Run settings validation and cache ownership tests
        run: make test_settings

      # HTTP interrupts, secret-free parameters and the external-location
      # client, including the storage transfer timeouts against a local server
      # that trickles or stalls (about 2 minutes).
      - name: Run HTTP interrupt, external-location and storage timeout tests
        run: make test_http_interrupt

      # enable-cache is off deliberately. The only uv project here is the
      # fixture checkout at /tmp/vgi-python, created after this step runs and
      # outside the workspace; the action's post-job "Pruning cache" step hung
      # on it for five minutes and then exited 2 — failing a job whose suite had
      # already passed 282/282. There is nothing worth caching: the clone is
      # shallow and the sync is seconds.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      # Clones vgi-python and PROVES the worker runs before the suite starts.
      # Without that proof a broken install is indistinguishable from success:
      # every test would skip and the run would report green.
      - name: Install the vgi-python fixture workers
        run: ./scripts/ci_install_fixtures.sh

      - name: Test authenticated catalog discovery
        env:
          VGI_PYTHON_DIR: /tmp/vgi-python
          QUERY_FARM_TELEMETRY_OPT_OUT: "1"
        run: |
          ./test/run_http_bearer_integration.sh 'test/sql/integration/bearer_auth/*' --min-executed 2 2>&1 | tee /tmp/vgi-bearer.log
          make test_catalog_discovery_auth 2>&1 | tee /tmp/vgi-discovery-auth.log
          python3 scripts/run_tests.py --min-executed 1 'test/sql/oauth/catalog_discovery_options.test' 2>&1 | tee /tmp/vgi-discovery-options.log

      - name: Build pinned Iroh qualification bridge
        run: |
          git clone --filter=blob:none https://github.com/Query-farm/vgi-rpc-rust.git /tmp/vgi-rpc-rust
          git -C /tmp/vgi-rpc-rust checkout 9e7dfb59686682be0ff4a46183988e2724416393
          cargo build --locked --release --manifest-path /tmp/vgi-rpc-rust/Cargo.toml -p vgi-iroh-bridge
          # vgi-rpc comes from the fixtures' own uv.lock (TODO(release-wave): the
          # pinned vgi-python protocol-3.4 commit locks vgi-rpc-python a07ccf2
          # from git), not from a source checkout.

      - name: Run native Iroh raw and HTTP integration
        env:
          BUILD_DIR: release
          VGI_PYTHON_DIR: /tmp/vgi-python
          VGI_IROH_BRIDGE_BIN: /tmp/vgi-rpc-rust/target/release/vgi-iroh-bridge
        run: ./test/run_iroh_integration.sh

      # A test binary that dies on a signal (a rare exit-time segfault was seen
      # once, after every assertion had passed) leaves a core in /tmp/cores; the
      # "Backtraces from crashed test binaries" step below prints and uploads its
      # stacks, so the next occurrence is diagnosable instead of a bare exit=-11.
      - name: Enable core dumps for test binaries
        run: |
          mkdir -p /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p
          sudo sysctl -w fs.suid_dumpable=1 || true

      # --min-executed is the guard that makes this job worth having. A lane
      # that stops running tests still reports green — fewer results, all of
      # them passing — which is exactly how this suite went unrun for months.
      # The floor is set below the current count so an unrelated environment
      # wobble does not fail the build, while a fixture dropping out does.
      # Raise it when the suite grows; lower it only in the commit that
      # legitimately removes tests.
      - name: Run the integration suite
        env:
          VGI_TEST_WORKER: launch:uv run --project /tmp/vgi-python vgi-fixture-worker
          VGI_TEST_BRANCH_DIR: /tmp/vgi-branch
          # vgi-python's example worker implements the secret-lookup fixtures
          # (docs/secret_lookup_fixtures.md).
          VGI_SECRET_LOOKUP_FIXTURES: "1"
          # ... and spatial_filter_example(..., edge_rows := true) from 0.50.1.
          VGI_SPATIAL_EDGE_ROWS_FIXTURE: "1"
          # No vgi-python writable_tx fixture yet (docs/writable_tx_fixtures.md):
          # writable_tx/*.test skip on VGI_WRITABLE_TX_FIXTURES, allowed below.
        run: |
          ulimit -c unlimited || true
          mkdir -p "$VGI_TEST_BRANCH_DIR"
          # --isolate-launcher, as `make test_launcher` uses: DuckDB 2.0's unittest
          # gives each run a temporary HOME and deletes it on exit. A launch: worker
          # pooled across files inherits the first file's HOME, so its SQLite
          # state under $HOME/.local/state/vgi vanishes and every later file fails
          # with 'unable to open database file'. A per-file pool avoids that.
          python3 scripts/run_tests.py -j 4 --isolate-launcher \
            --min-executed 280 \
            --allow-skip 'require spatial' \
            --allow-skip 'require-env VGI_DOCKER_IMAGE' \
            --allow-skip 'require-env VGI_DOCKER_TCP_IMAGE' \
            --allow-skip 'require-env VGI_DOCKER_TX_IMAGE' \
            --allow-skip 'require-env VGI_DATABASE_BUN_WORKER' \
            --allow-skip 'require-env VGI_DATABASE_PYTHON_WORKER' \
            --allow-skip 'require-env VGI_DATABASE_RUST_WORKER' \
            --allow-skip 'require-env VGI_GITHUB_NETWORK_TESTS' \
            --allow-skip 'require-env VGI_TEST_ICEBERG' \
            --allow-skip 'require-env VGI_TEST_COMPANION_TARGET' \
            --allow-skip 'require-env VGI_TEST_BEARER_TOKEN' \
            --allow-skip 'require-env VGI_HTTP_TRANSPORT' \
            --allow-skip 'require-env VGI_HTTP_DISABLE_ZSTD' \
            --allow-skip 'require-env VGI_HTTP_NO_COMPRESSION' \
            --allow-skip 'require-env VGI_VERSIONED_HTTP_WORKER' \
            --allow-skip 'require-env VGI_VERSIONED_TABLES_HTTP_WORKER' \
            --allow-skip 'require-env VGI_VERSIONED_WORKER' \
            --allow-skip 'require-env VGI_VERSIONED_TABLES_WORKER' \
            --allow-skip 'require-env VGI_ATTACH_OPTIONS_WORKER' \
            --allow-skip 'require-env VGI_ATTACH_OPTIONS_REQUIRED_WORKER' \
            --allow-skip 'require-env VGI_BAD_PROTOCOL_WORKER' \
            --allow-skip 'require-env VGI_BAD_ENUM_WORKER' \
            --allow-skip 'require-env VGI_SIMPLE_WRITABLE_WORKER' \
            --allow-skip 'require-env VGI_WRITABLE_TX_FIXTURES' \
            --allow-skip 'require-env VGI_WRITABLE_TX_WORKER' \
            --allow-skip 'require-env VGI_SCHEMA_RECONCILE_DB' \
            --allow-skip 'require-env VGI_RULES_WORKER' \
            --allow-skip 'require-env VGI_REQUIRE_LAUNCHER_TRANSPORT' \
            --allow-skip 'require-env VGI_WORKER_SUPPORTS_DYNAMIC_CODE' \
            --allow-skip 'require-env VGI_MALFORMED_BATCH_WORKER' \
            --allow-skip 'require-env VGI_NO_REFLECTION_WORKER' \
            --allow-skip 'require-env VGI_ROWID_CONSTRAINT_WORKER' \
            --allow-skip 'require-env VGI_VISIBILITY_WORKER' \
            --allow-skip 'require-env VGI_WRITE_CONTRACT_WORKER' \
            --allow-skip 'require-env-not VGI_ENGINE_CORRELATED_NAMED_ARGS' \
            --allow-skip 'require-env-not VGI_ENGINE_DELETE_RETURNING_VIRTUAL_COLUMNS' \
            "test/sql/integration/*" \
            "test/sql/engine_features/*"

      # Protocol version negotiation v1 (docs/protocol_versions.md): attach at the
      # negotiated version, and a worker advertising vgi.v3 3.3-3.3 (the
      # vgi-python fixture switch VGI_TEST_PROTOCOL_RANGE) fails ATTACH naming
      # both ranges. Outside test/sql/integration/, so SDK lanes never see it.
      - name: Run the protocol negotiation tests
        env:
          VGI_TEST_WORKER: launch:uv run --project /tmp/vgi-python vgi-fixture-worker
          VGI_PROTOCOL_RANGE_WORKER: launch:env VGI_TEST_PROTOCOL_RANGE=3.3-3.3 uv run --project /tmp/vgi-python vgi-fixture-worker
        run: python3 scripts/run_tests.py -j 2 --isolate-launcher --min-executed 2 "test/sql/protocol_negotiation/*"

      - name: Backtraces from crashed test binaries
        if: always()
        run: |
          shopt -s nullglob
          cores=(/tmp/cores/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no core dumps"
            exit 0
          fi
          sudo apt-get install -y -qq gdb > /dev/null
          for core in "${cores[@]}"; do
            exe=$(file -b "$core" | sed -n "s/.*execfn: '\([^']*\)'.*/\1/p")
            [ -n "$exe" ] || exe=build/release/test/unittest
            echo "=== $core ($exe)"
            gdb -batch -nx -ex "set pagination off" -ex "thread apply all bt" "$exe" "$core" 2>&1 \
              | tee "$core.backtrace.txt" | head -400
          done

      - name: Upload crash backtraces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-backtraces
          path: /tmp/cores/*.backtrace.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Cache statistics
        if: always()
        run: |
          ccache -s -v || true
          sccache --show-stats || true
