# The VGI integration suite — the one job that actually runs a worker.
#
# This is separate from MainDistributionPipeline.yml on purpose. That pipeline
# calls a reusable workflow which exposes no hook to run a COMMAND before its
# test step (only `test_env_variables`), and on its Linux leg the tests run
# inside `docker run ... make test_release`, a fresh container. There is nowhere
# in it to install the fixture workers, so every integration .test file there
# hits `require-env VGI_TEST_WORKER` and skips. This workflow owns its own
# steps, so it can install first and then test.
#
# The fixture workers come from the PUBLIC vgi-python repo's dev-only sidecar —
# they are deliberately absent from the published wheel, which would otherwise
# pollute end-user PATH.
#
# VGI_FIXTURES_REF pins the revision, and it pins to a RELEASE TAG, not `main`.
# Defaulting to `main` made every run depend on whatever was pushed there at the
# time: a protocol bump landing on either side flipped CI from green to a failed
# ATTACH with no change to this repo, and — worse — a green run proved nothing
# about any released worker. The tag makes the run reproducible and turns
# "vgi-python moved" into an explicit one-line bump here, which is the only
# place that decision should be visible.
#
# Bump this in lockstep with the protocol: it must name a vgi-python release
# speaking the same VGI_PROTOCOL_VERSION as src/, or ATTACH fails with a message
# naming both versions. Override per-run via the workflow_dispatch input.
name: Integration suite

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fixtures_ref:
        description: "vgi-python revision to take the fixture workers from"
        required: false
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration suite (launcher transport)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VGI_INSTALL_FIXTURES: "1"
      VGI_FIXTURES_DIR: /tmp/vgi-python
      VGI_FIXTURES_REF: ${{ inputs.fixtures_ref || 'v0.31.2' }}
      GEN: ninja
      USE_MERGED_VCPKG_MANIFEST: "1"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: vgi-integration-${{ runner.os }}

      - uses: dtolnay/rust-toolchain@1.97

      # vcpkg's GitHub-Actions binary cache needs these two, and they are only
      # readable from a step's env — hence the explicit export rather than the
      # workflow-level `env:` block above.
      - name: Export vcpkg cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Build the extension (release)
        run: make release

      # enable-cache is off deliberately. The only uv project here is the
      # fixture checkout at /tmp/vgi-python, created after this step runs and
      # outside the workspace; the action's post-job "Pruning cache" step hung
      # on it for five minutes and then exited 2 — failing a job whose suite had
      # already passed 282/282. There is nothing worth caching: the clone is
      # shallow and the sync is seconds.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      # Clones vgi-python and PROVES the worker runs before the suite starts.
      # Without that proof a broken install is indistinguishable from success:
      # every test would skip and the run would report green.
      - name: Install the vgi-python fixture workers
        run: ./scripts/ci_install_fixtures.sh

      - name: Build pinned Iroh qualification bridge
        run: |
          git clone --filter=blob:none https://github.com/Query-farm/vgi-rpc-rust.git /tmp/vgi-rpc-rust
          git -C /tmp/vgi-rpc-rust checkout c105d7b047e912355a79420ced81cf296ec52c73
          cargo build --locked --release --manifest-path /tmp/vgi-rpc-rust/Cargo.toml -p vgi-iroh-bridge
          git clone --filter=blob:none https://github.com/Query-farm/vgi-rpc-python.git /tmp/vgi-rpc-python
          git -C /tmp/vgi-rpc-python checkout 365395a6144256ec163b17cf9b755b9b5f6a386c

      - name: Run native Iroh raw and HTTP integration
        env:
          BUILD_DIR: release
          VGI_PYTHON_DIR: /tmp/vgi-python
          VGI_RPC_PYTHON_DIR: /tmp/vgi-rpc-python
          VGI_IROH_BRIDGE_BIN: /tmp/vgi-rpc-rust/target/release/vgi-iroh-bridge
        run: ./test/run_iroh_integration.sh

      # --min-executed is the guard that makes this job worth having. A lane
      # that stops running tests still reports green — fewer results, all of
      # them passing — which is exactly how this suite went unrun for months.
      # The floor is set below the current count so an unrelated environment
      # wobble does not fail the build, while a fixture dropping out does.
      # Raise it when the suite grows; lower it only in the commit that
      # legitimately removes tests.
      - name: Run the integration suite
        env:
          VGI_TEST_WORKER: launch:uv run --project /tmp/vgi-python vgi-fixture-worker
          VGI_TEST_BRANCH_DIR: /tmp/vgi-branch
        run: |
          mkdir -p "$VGI_TEST_BRANCH_DIR"
          python3 scripts/run_tests.py -j 4 \
            --min-executed 280 \
            --allow-skip 'require spatial' \
            --allow-skip 'require-env VGI_DOCKER_IMAGE' \
            --allow-skip 'require-env VGI_DOCKER_TCP_IMAGE' \
            --allow-skip 'require-env VGI_DATABASE_BUN_WORKER' \
            --allow-skip 'require-env VGI_DATABASE_PYTHON_WORKER' \
            --allow-skip 'require-env VGI_DATABASE_RUST_WORKER' \
            --allow-skip 'require-env VGI_GITHUB_NETWORK_TESTS' \
            --allow-skip 'require-env VGI_TEST_ICEBERG' \
            --allow-skip 'require-env VGI_TEST_COMPANION_TARGET' \
            --allow-skip 'require-env VGI_TEST_BEARER_TOKEN' \
            --allow-skip 'require-env VGI_TEST_DEDICATED_WORKER' \
            --allow-skip 'require-env VGI_HTTP_TRANSPORT' \
            --allow-skip 'require-env VGI_HTTP_DISABLE_ZSTD' \
            --allow-skip 'require-env VGI_HTTP_NO_COMPRESSION' \
            --allow-skip 'require-env VGI_VERSIONED_HTTP_WORKER' \
            --allow-skip 'require-env VGI_VERSIONED_TABLES_HTTP_WORKER' \
            --allow-skip 'require-env VGI_VERSIONED_WORKER' \
            --allow-skip 'require-env VGI_VERSIONED_TABLES_WORKER' \
            --allow-skip 'require-env VGI_ATTACH_OPTIONS_WORKER' \
            --allow-skip 'require-env VGI_ATTACH_OPTIONS_REQUIRED_WORKER' \
            --allow-skip 'require-env VGI_BAD_PROTOCOL_WORKER' \
            --allow-skip 'require-env VGI_BAD_ENUM_WORKER' \
            --allow-skip 'require-env VGI_SIMPLE_WRITABLE_WORKER' \
            --allow-skip 'require-env VGI_SCHEMA_RECONCILE_DB' \
            --allow-skip 'require-env VGI_RULES_WORKER' \
            --allow-skip 'require-env VGI_REQUIRE_LAUNCHER_TRANSPORT' \
            --allow-skip 'require-env VGI_WORKER_SUPPORTS_DYNAMIC_CODE' \
            "test/sql/integration/*"
